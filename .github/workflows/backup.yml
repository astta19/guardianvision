name: Backup Diário — Fiscal365

on:
  schedule:
    - cron: '0 6 * * *'  # 03:00 BRT (06:00 UTC) todo dia
  workflow_dispatch:       # permite rodar manualmente pelo GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get install -y postgresql-client

      - name: Executar pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATA=$(date +%Y-%m-%d)
          HORA=$(date +%H%M)
          ARQUIVO="backups/backup_${DATA}_${HORA}.sql.gz"

          mkdir -p backups

          pg_dump "$DATABASE_URL" \
            --no-password \
            --format=plain \
            --no-owner \
            --no-acl \
            --exclude-table=usage_diario \
            | gzip > "$ARQUIVO"

          echo "Backup gerado: $ARQUIVO ($(du -sh $ARQUIVO | cut -f1))"

      - name: Remover backups com mais de 90 dias
        run: find backups/ -name "*.sql.gz" -mtime +90 -delete

      - name: Commitar backup
        run: |
          git config user.name  "Fiscal365 Backup Bot"
          git config user.email "backup@fiscal365.com"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: $(date +%Y-%m-%d)"
          git push
